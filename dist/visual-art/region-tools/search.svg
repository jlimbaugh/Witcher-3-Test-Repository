<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Search the guide: lens over a field journal (original code-drawn guide art, not official)">
  <!-- Original code-drawn guide art for the Region Tools "Search" tile (LT, v49 fixes). Not CD PROJEKT RED artwork. -->
  <defs>
    <radialGradient id="glow" cx="62%" cy="30%" r="80%"><stop offset="0" stop-color="#5a4a2c"/><stop offset=".45" stop-color="#2a2a22"/><stop offset="1" stop-color="#0d1112"/></radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3d2a6"/><stop offset=".6" stop-color="#cdb784"/><stop offset="1" stop-color="#9c8458"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2ebe6"/><stop offset=".25" stop-color="#87989c"/><stop offset=".5" stop-color="#c5d1ce"/><stop offset=".75" stop-color="#4b585f"/><stop offset="1" stop-color="#2a3439"/></linearGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#bfe6dc" stop-opacity=".55"/><stop offset=".55" stop-color="#5fc7b4" stop-opacity=".18"/><stop offset="1" stop-color="#0d1a1c" stop-opacity=".55"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <clipPath id="glass"><circle cx="268" cy="168" r="82"/></clipPath>
  </defs>
  <rect width="480" height="400" fill="url(#glow)"/>
  <g opacity=".35" stroke="#000" stroke-width="2"><path d="M0 300h480M0 330h480M0 362h480"/></g>
  <!-- open journal -->
  <g transform="rotate(-6 240 250)">
    <path d="M58 182q90-22 182 8v190q-92-30-182-8z" fill="url(#page)" stroke="#5a4528" stroke-width="3"/>
    <path d="M240 190q92-30 182-8v190q-90-22-182 8z" fill="url(#page)" stroke="#5a4528" stroke-width="3"/>
    <path d="M240 190v190" stroke="#6b5434" stroke-width="4"/>
    <g stroke="#4a3b27" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M84 214q60-10 130 4M84 240q60-10 130 4M84 266q50-8 104 2M84 292q60-10 130 4M84 318q46-7 96 2"/>
      <path d="M266 222q60-14 128-6M266 248q60-14 128-6M266 274q40-9 86-4M266 300q60-14 128-6M266 326q44-10 92-5"/>
    </g>
  </g>
  <!-- magnified ink: wolf-paw track under the lens -->
  <g clip-path="url(#glass)">
    <rect x="180" y="80" width="180" height="180" fill="#d9c697"/>
    <g fill="#3a2d1d"><ellipse cx="268" cy="190" rx="26" ry="22"/><ellipse cx="236" cy="152" rx="10" ry="14"/><ellipse cx="258" cy="136" rx="10" ry="14"/><ellipse cx="282" cy="136" rx="10" ry="14"/><ellipse cx="302" cy="152" rx="10" ry="14"/></g>
    <circle cx="268" cy="168" r="82" fill="url(#lens)"/>
  </g>
  <!-- lens rim and handle -->
  <path d="M322 228l78 92" stroke="#1b2124" stroke-width="30" stroke-linecap="round"/>
  <path d="M322 228l78 92" stroke="url(#steel)" stroke-width="20" stroke-linecap="round"/>
  <path d="M334 242l10 12m6 7l10 12m6 7l10 12" stroke="#2a3439" stroke-width="5"/>
  <circle cx="268" cy="168" r="86" fill="none" stroke="#141a1d" stroke-width="18"/>
  <circle cx="268" cy="168" r="86" fill="none" stroke="url(#steel)" stroke-width="11"/>
  <path d="M212 120a76 76 0 0 1 64-36" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <rect width="480" height="400" fill="url(#vig)"/>
</svg>
