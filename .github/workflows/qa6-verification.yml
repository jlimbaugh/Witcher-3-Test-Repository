name: Phoenix QA6 verification
on:
  push:
    branches: [ci/qa6-independent-checks]
  pull_request:
    branches: [fix/wo-save-preservation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V45_COMMIT: d1df0e3e2c40cad172577f4725daa7233fc8c41e
      QA5_COMMIT: 5ba73ace7d05551c877021de6e6fd0a2242a1e3a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Identify source and prepare baselines
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git worktree add --detach "$RUNNER_TEMP/v45-baseline" "$V45_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/qa5-baseline" "$QA5_COMMIT"
      - name: Verify candidate manifests
        run: |
          set -euo pipefail
          sha256sum -c docs/MANIFEST.sha256
          sha256sum -c docs/RELEASE-FILES-QA6.sha256
      - name: Test accepted baseline
        working-directory: ${{ runner.temp }}/v45-baseline/dist
        run: node --test *.test.cjs
      - name: Test QA5 control
        working-directory: ${{ runner.temp }}/qa5-baseline/dist
        env:
          PHOENIX_V45_BASELINE: ${{ runner.temp }}/v45-baseline/dist
        run: node --test *.test.cjs
      - name: Test candidate with both baselines
        working-directory: dist
        env:
          PHOENIX_V45_BASELINE: ${{ runner.temp }}/v45-baseline/dist
          PHOENIX_QA5_BASELINE: ${{ runner.temp }}/qa5-baseline/dist
        run: node --test *.test.cjs
      - name: Verify rollback on disposable copies
        run: |
          set -euo pipefail
          script=docs/rollback/restore_and_verify.py
          python3 "$script" --kit "$RUNNER_TEMP/v45-baseline" --qa5-kit "$RUNNER_TEMP/qa5-baseline" --self-check
          for target in qa5 v45; do
            copy="$RUNNER_TEMP/rollback-$target"
            cp -a dist "$copy"
            python3 "$script" --kit "$RUNNER_TEMP/v45-baseline" --qa5-kit "$RUNNER_TEMP/qa5-baseline" --from qa6 --to "$target" --dist "$copy" --dry-run
            python3 "$script" --kit "$RUNNER_TEMP/v45-baseline" --qa5-kit "$RUNNER_TEMP/qa5-baseline" --from qa6 --to "$target" --dist "$copy"
            if [ "$target" = qa5 ]; then baseline="$RUNNER_TEMP/qa5-baseline/dist"; else baseline="$RUNNER_TEMP/v45-baseline/dist"; fi
            diff -r "$baseline" "$copy"
          done
          cp -a "$RUNNER_TEMP/qa5-baseline/dist" "$RUNNER_TEMP/wrong-source"
          set +e
          python3 "$script" --kit "$RUNNER_TEMP/v45-baseline" --qa5-kit "$RUNNER_TEMP/qa5-baseline" --from qa6 --to v45 --dist "$RUNNER_TEMP/wrong-source"
          result=$?
          set -e
          test "$result" -eq 3
          diff -r "$RUNNER_TEMP/qa5-baseline/dist" "$RUNNER_TEMP/wrong-source"
