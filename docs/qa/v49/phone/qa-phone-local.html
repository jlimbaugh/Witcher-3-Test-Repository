<!doctype html><meta charset="utf-8"><title>Phoenix isolated phone checks</title><pre id="report">Running…</pre><script type="module">
const output=document.querySelector('pre'), results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const html=await (await fetch('index.html')).text();
let frame,w,d;
const check=(v,msg)=>{if(!v)throw Error(msg)};
async function test(id,fn){const filter=new URLSearchParams(location.search).get('check');if(filter&&!id.startsWith(filter))return;try{let data=await fn();results.push(['PASS',id,data])}catch(e){results.push(['FAIL',id,String(e)])}output.textContent=JSON.stringify(results,null,1)}
async function boot(hash,width=390,height=844,mode='normal',seed={}){
 frame?.remove();frame=document.createElement('iframe');frame.style.cssText='border:0;width:'+width+'px;height:'+height+'px';frame.src='qa-blank-local.html';await new Promise(resolve=>{frame.onload=resolve;document.body.append(frame)});
 // Load the normal entry point in a disposable test frame on this origin.
 const template=html.replace('<head>', '<head><base href="'+location.origin+'/"><script>history.replaceState(null,"","/index.html'+hash+'");const records=new Map(Object.entries('+JSON.stringify(seed)+'));Object.defineProperty(window,"localStorage",{get(){if('+JSON.stringify(mode)+'==="denied")throw Error("denied");return {getItem:k=>records.get(k)??null,setItem:(k,v)=>{if('+JSON.stringify(mode)+'==="quota")throw Error("quota");records.set(k,String(v))},removeItem:k=>records.delete(k)}}});window.qaRecords=records;<\/script>');
 frame.contentDocument.open();frame.contentDocument.write(template);frame.contentDocument.close();w=frame.contentWindow;d=frame.contentDocument;for(let i=0;i<375&&!w.PhoenixVelen;i++)await wait(80);await wait(230);check(w.PhoenixVelen,'startup failed');
}
const one=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],click=s=>{const x=one(s);check(x,s);x.click()};
for(const [width,height] of [[375,667],[390,844],[430,932],[844,390]])await test('Nilf hub '+width+'x'+height,async()=>{await boot('#velen/hub/nilf',width,height);let root=one('[data-velen-nilf=hub]'),q=s=>root.querySelector(s),css=s=>w.getComputedStyle(q(s)),a=q('.home-action-tile').getBoundingClientRect();check(q('.quest-hub-progress').nextElementSibling.matches('.quest-hub-preparation'),'order');check(q('.nilf-next-objective').textContent.includes('Travel'),'next text');check(q('.quest-hub-tools').children.length===1,'extra link');if(width<500){check(css('h1').fontSize==='32px','title '+css('h1').fontSize);check(a.bottom<=one('.phoenix-reader').getBoundingClientRect().bottom,'button outside '+a.bottom)}return {title:css('h1').fontSize,brief:css('.quest-hub-description').fontSize,buttonBottom:a.bottom,rail:w.getComputedStyle(q('.quest-hub-paper'),'::before').left}});
await test('NUM-01 and Back',async()=>{await boot('#velen');click('[data-velen-deck=quests] button[aria-label^="39."]:not([aria-hidden])');await wait(250);let sel=one('[data-velen-deck=quests] button[aria-current]:not([aria-hidden])');check(sel.textContent==='39'&&w.getComputedStyle(sel).textDecorationLine==='underline','selection');let result=[];for(let i=0;i<3;i++){let a=all('.selected-panel .home-selected-actions a')[i];a.scrollIntoView({block:'center'});await wait(120);let y=w.PhoenixViewport.scrollY;a.click();await wait(120);check(w.location.hash.includes('loves-cruel-snares'),w.location.hash);w.history.back();await wait(300);result.push([y,w.PhoenixViewport.scrollY,w.history.state?.pageY]);}check(result.every(([y,b])=>Math.abs(y-b)<4),JSON.stringify(result));return result});
for(const mode of ['denied','quota','corrupt'])await test('PRG-01/04 '+mode,async()=>{let key='phoenix.region.velen.v1';await boot('#velen/hub/nilf',390,844,mode,mode==='corrupt'?{[key]:'{broken'}:{});let input='[data-velen-check$=":travel"]';check(one(input),'no objectives');check(one('#velen-screen .risk-note[role=status]'),'no warning');click(input);await wait(180);check(one(input).checked,'mark');click('[data-velen-undo]');await wait(150);check(!one(input).checked,'undo');if(mode==='corrupt')check(w.qaRecords.get(key)==='{broken','bytes');return 'mark and Undo'});
await test('PRG-03',async()=>{for(let r of ['#home','#whiteorchard-console','#progress']){await boot(r,390,844,'normal',{'phoenix.whiteorchard.interaction.v1':'{bad'});let n=one('.view:not([hidden]) [data-wo-save-notice]');check(n&&n.textContent.includes('kept unchanged'),r)}return 'three pages'});
await test('Sources',async()=>{await boot('#velen/hub/pyres');check(one('#velen-screen .sw-source-link').hash==='#pyres','Pyres');await boot('#quest-lilac');let v=one('.view:not([hidden])');check(!v.querySelector('a[href^="https:"]'),'inline');check(v.querySelector('a[href$="#q-lilac"]'),'footer');return v.id});
await test('Correction PRG-02',async()=>{await boot('#velen/hub/nilf');let ask='[data-velen-check$=":ask"]';click(ask);let select=one('dialog[open] [data-velen-choice]');select.value='fight';select.onchange();click('[data-velen-confirm]');await wait(180);check(one(ask).checked,'ask marked');click(ask);let impact=one('dialog[open] [data-review-impact]');check(impact?.textContent.includes('Fought the baron'),'route named');click('[data-velen-cancel]');check(one(ask).checked,'cancel');return 'fight named before clearing'});
await test('Correction Undo',async()=>{await boot('#quest-beast');let c=one('#quest-beast [data-objective-check="q-beast:herbalist"]');c.click();await wait(120);one('dialog[open] [data-confirm]')?.click();await wait(140);let wk='phoenix.whiteorchard.interaction.v1', seed=Object.fromEntries(w.qaRecords);await boot('#quest-lilac',390,844,'normal',seed);let btn=one('#quest-lilac [data-undo-deck]');check(/Beast of White Orchard/.test(btn?.textContent),btn?.textContent||'no button');btn.click();await wait(120);check(JSON.parse(w.qaRecords.get(wk)).progress.objectives['q-beast:herbalist']!=='done','undo');return 'other quest named after reload and undone'});
for(const mode of ['denied','quota','corrupt'])await test('Visit walkthrough '+mode,async()=>{let key='phoenix.region.velen.v1';await boot('#velen/hub/nilf',390,844,mode,mode==='corrupt'?{[key]:'{broken'}:{});click('[data-velen-check$=":travel"]');await wait(180);click('[data-velen-nilf=hub] a[href="#velen/quest/nilf/1"]');await wait(400);let x=one('#velen-screen .sw-box [data-velen-check$=":travel"]');check(x?.checked,'walkthrough reflects hub');click('#velen-screen .sw-story [data-velen-undo]');await wait(350);check(!one('#velen-screen .sw-box [data-velen-check$=":travel"]')?.checked,'walkthrough Undo');return 'shared mark and Undo'});
output.dataset.finished='yes';
</script>
