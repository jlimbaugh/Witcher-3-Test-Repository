<!doctype html><meta charset="utf-8"><title>Phoenix isolated phone checks</title><pre id="report">Running…</pre><script type="module">
const output=document.querySelector('pre'), results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const html=await (await fetch('index.html')).text();
let frame,w,d;
const check=(v,msg)=>{if(!v)throw Error(msg)};
async function test(id,fn){const filter=new URLSearchParams(location.search).get('check');if(filter&&!id.startsWith(filter))return;try{let data=await fn();results.push(['PASS',id,data])}catch(e){results.push(['FAIL',id,String(e)])}output.textContent=JSON.stringify(results,null,1)}
async function boot(hash,width=390,height=844,mode='normal',seed={}){
 frame?.remove();frame=document.createElement('iframe');frame.style.cssText='border:0;width:'+width+'px;height:'+height+'px';frame.src='qa-blank-local.html';await new Promise(resolve=>{frame.onload=resolve;document.body.append(frame)});
 // Load the normal entry point in a disposable test frame on this origin.
 const template=html.replace('<head>', '<head><base href="'+location.origin+'/"><script>history.replaceState(null,"","/index.html'+hash+'");const records=new Map(Object.entries('+JSON.stringify(seed)+'));Object.defineProperty(window,"localStorage",{get(){if('+JSON.stringify(mode)+'==="denied")throw Error("denied");return {getItem:k=>records.get(k)??null,setItem:(k,v)=>{if('+JSON.stringify(mode)+'==="quota")throw Error("quota");records.set(k,String(v))},removeItem:k=>records.delete(k)}}});window.qaRecords=records;<\/script>');
 frame.contentDocument.open();frame.contentDocument.write(template);frame.contentDocument.close();w=frame.contentWindow;d=frame.contentDocument;for(let i=0;i<375&&!w.PhoenixVelen;i++)await wait(80);await wait(230);check(w.PhoenixVelen,'startup failed');
}
const one=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],click=s=>{const x=one(s);check(x,s);x.click()};
for(const [width,height,hash] of [[390,844,'#velen'],[844,390,'#velen/quest/nilf/1']])await test(hash+' '+width,async()=>{
 await boot(hash,width,height);const tools='#velen-region-tools',nav=one('#velen-screen .velen-section-jump select');check(nav,'jump menu');nav.value='Region Tools';nav.onchange();check(d.activeElement===one(tools+' h2'),'jump focus');check(!one(tools+' .deck-jump'),'no number strip');
 const current=()=>one(tools+' .quest-card.selected');let ids=[];
 for(let i=0;i<8;i++){ids.push(current().dataset.tool);check(one(tools+' .home-action-tile img').getAttribute('src')===current().querySelector('img').getAttribute('src'),'art');click(tools+' .quest-card.right');}
 check(new Set(ids).size===8&&current().dataset.tool==='home','wrap');
 const field=one(tools+' input');field.value='Hendrik';field.form.requestSubmit();await wait(300);
 check(w.location.hash==='#guide-search/q=Hendrik','search URL '+w.location.hash);check(!one('#guide-search').hidden&&one('#guide-search input').value==='Hendrik','splash query');const matches=all('#guide-search [data-search-result]');check(matches.length,'results');matches[0].click();await wait(300);click('.view:not([hidden]) .guide-search-return');await wait(350);check(one('#guide-search input').value==='Hendrik'&&!one('#guide-search').hidden,'return');
 w.history.back();await wait(350);check(w.location.hash===hash,'origin');return ids;
});
output.dataset.finished='yes';
</script>
