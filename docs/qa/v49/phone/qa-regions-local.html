<!doctype html><meta charset="utf-8"><title>Phoenix isolated phone checks</title><pre id="report">Running…</pre><script type="module">
const output=document.querySelector('pre'), results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const html=await (await fetch('index.html')).text();
let frame,w,d;
const check=(v,msg)=>{if(!v)throw Error(msg)};
async function test(id,fn){const filter=new URLSearchParams(location.search).get('check');if(filter&&!id.startsWith(filter))return;try{let data=await fn();results.push(['PASS',id,data])}catch(e){results.push(['FAIL',id,String(e)])}output.textContent=JSON.stringify(results,null,1)}
async function boot(hash,width=390,height=844,mode='normal',seed={}){
 frame?.remove();frame=document.createElement('iframe');frame.style.cssText='border:0;width:'+width+'px;height:'+height+'px';frame.src='qa-blank-local.html';await new Promise(resolve=>{frame.onload=resolve;document.body.append(frame)});
 // Load the normal entry point in a disposable test frame on this origin.
 const template=html.replace('<head>', '<head><base href="'+location.origin+'/"><script>history.replaceState(null,"","/index.html'+hash+'");const records=new Map(Object.entries('+JSON.stringify(seed)+'));Object.defineProperty(window,"localStorage",{get(){if('+JSON.stringify(mode)+'==="denied")throw Error("denied");return {getItem:k=>records.get(k)??null,setItem:(k,v)=>{if('+JSON.stringify(mode)+'==="quota")throw Error("quota");records.set(k,String(v))},removeItem:k=>records.delete(k)}}});window.qaRecords=records;<\/script>');
 frame.contentDocument.open();frame.contentDocument.write(template);frame.contentDocument.close();w=frame.contentWindow;d=frame.contentDocument;for(let i=0;i<375&&!w.PhoenixVelen;i++)await wait(80);await wait(230);check(w.PhoenixVelen,'startup failed');
}
const one=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],click=s=>{const x=one(s);check(x,s);x.click()};
let reference;
for(const hash of ['#velen/quest/nilf/1','#home','#regions','#whiteorchard-console','#quest-lilac','#velen'])await test(hash,async()=>{
 const landscape=new URLSearchParams(location.search).has('landscape');await boot(hash,landscape?844:390,landscape?390:844);const view=one('.view:not([hidden])');const sections=view.querySelectorAll('.velen-tools-section');check(sections.length===1,'expected one deck, got '+sections.length);const menu=sections[0],get=s=>menu.querySelector(s),card=()=>get('.quest-card.selected'),action=()=>get('.home-action-tile');
 const signature=()=>{let style=w.getComputedStyle(card()),b=w.getComputedStyle(action());return [style.width,style.height,style.fontFamily,style.borderImageSource,b.minHeight,w.getComputedStyle(get('.deck')).height]};const measured=signature();reference??=measured;check(JSON.stringify(measured)===JSON.stringify(reference),'template sizing '+JSON.stringify({measured,reference}));
 const ids=[];for(let i=0;i<8;i++){ids.push(card().dataset.tool);check(action().querySelector('img').src===card().querySelector('img').src,'art');if(card().dataset.tool==='warnings'){action().click();check(!get('.regional-warning-list').hidden&&one('.medallion-core').getAttribute('aria-expanded')!=='true','independent warnings');action().click();}if(card().dataset.tool==='maps'){check(action().hash===(hash.includes('velen')?'#velen/map':'#whiteorchard-map'),'map '+action().hash);
 if(hash==='#home'||hash==='#regions'){view.querySelector('[aria-label="Next region"]').click();await wait(80);check(action().hash==='#velen/map','Velen context');}}
 get('.quest-card.right').click();}check(new Set(ids).size===8&&!get('.deck-jump'),'eight cards');check(!view.querySelector('.main-search-trigger,.home-tools-browse'),'old controls');
 const wolf=one('.medallion-core');wolf.click();await wait(100);check(wolf.getAttribute('aria-expanded')==='true','wolf opens');wolf.click();await wait(100);check(wolf.getAttribute('aria-expanded')!=='true'&&card().dataset.tool==='home','wolf closes independently');
 let input=get('input[type=search]');input.value='Hendrik';input.form.requestSubmit();await wait(180);check(one('#guide-search [data-search-result]')&&w.location.hash==='#guide-search/q=Hendrik','search');w.history.back();await wait(220);check(w.location.hash===hash,'back');return {measured,reference};
});
output.dataset.finished='yes';
</script>
